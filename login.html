<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DOIT SEND</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080810;
      --card:        #10111e;
      --border:      #252840;
      --accent:      #2dd4bf;
      --accent-dim:  #14b8a6;
      --accent-glow: rgba(45,212,191,0.18);
      --red:         #ef4444;
      --text:        #f1f5f9;
      --text-2:      #94a3b8;
      --text-3:      #475569;
      --radius:      16px;
      --radius-sm:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Blobs animados */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 10%, rgba(45,212,191,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 85%, rgba(6,182,212,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 70% 20%, rgba(45,212,191,0.07) 0%, transparent 60%);
      animation: bgPulse 10s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Logo / header */
    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 72px; height: 72px;
      background: #fff;
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(45,212,191,0.3), 0 0 50px rgba(45,212,191,0.25), 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 22px;
      padding: 8px; overflow: hidden;
    }
    .login-logo svg { width: 100%; height: 100%; }

    .login-header h1 {
      font-size: 26px; font-weight: 900; letter-spacing: -0.6px;
      background: linear-gradient(90deg, #fff 40%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 13px; color: var(--text-2); letter-spacing: 0.02em;
    }

    /* Card */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,212,191,0.4), transparent);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: var(--text-2); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 16px; pointer-events: none;
      opacity: 0.5;
    }

    input {
      width: 100%;
      background: #0f1117;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit; font-size: 14px;
      padding: 12px 42px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 16px; padding: 4px;
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: var(--text-2); }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #fff; font-family: inherit; font-size: 15px; font-weight: 700;
      border: none; border-radius: var(--radius-sm);
      padding: 14px; cursor: pointer;
      transition: all 0.2s cubic-bezier(.22,.68,0,1.2); margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(45,212,191,0.35);
    }
    .btn-login:hover { box-shadow: 0 6px 28px rgba(45,212,191,0.5); transform: translateY(-1px); }
    .btn-login:active { transform: scale(0.97); }

    .error-banner {
      display: flex; align-items: center; gap: 10px;
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm); padding: 12px 14px;
      color: #fca5a5; font-size: 13px; margin-bottom: 20px;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px; color: var(--text-3);
    }

    .hidden { display: none !important; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 20px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider span { font-size: 11px; color: var(--text-3); white-space: nowrap; }

    .btn-google {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1f2937;
      font-family: inherit; font-size: 15px; font-weight: 600;
      border: none; border-radius: var(--radius-sm);
      padding: 13px; cursor: pointer; text-decoration: none;
      transition: all 0.2s cubic-bezier(.22,.68,0,1.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .btn-google:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(0,0,0,0.5); }
    .btn-google:active { transform: scale(0.97); }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="login-header">
    <div class="login-logo">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ds-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1e3a8a"/>
          </linearGradient>
        </defs>
        <circle cx="10" cy="40" r="3" fill="url(#ds-grad)"/>
        <rect x="6" y="30" width="16" height="4.5" rx="2.25" fill="url(#ds-grad)"/>
        <rect x="6" y="45.5" width="16" height="4.5" rx="2.25" fill="url(#ds-grad)"/>
        <path d="M30 16 h14 a24 24 0 0 1 0 48 h-14 a3 3 0 0 1 -3 -3 V19 a3 3 0 0 1 3 -3 z
                 M37 26 V54 h7 a14 14 0 0 0 0 -28 z" fill="url(#ds-grad)" fill-rule="evenodd"/>
        <path d="M20 40 h22 l-8 -8 h9 l11 8 -11 8 h-9 l8 -8 z" fill="url(#ds-grad)"/>
      </svg>
    </div>
    <h1>DOIT SEND</h1>
    <p>Faça login para acessar o painel</p>
  </div>

  <div class="login-card">

    <!-- Erro de login (exibido via JS quando ?erro=1) -->
    <div class="error-banner hidden" id="error-banner">
      <span>🚨</span>
      <span>E-mail ou senha incorretos. Tente novamente.</span>
    </div>

    <!-- Login com Google (método principal — cada conta tem seus próprios dados) -->
    <a href="/auth/google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 12.5 24 12.5c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 16.3 4.5 9.7 8.9 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 43.5c5.4 0 10.3-1.9 14-5.2l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.1 16.2 43.5 24 43.5z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.5 5.5c-.5.4 7-5 7-15 0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      <span>Entrar com Google</span>
    </a>

    <div class="divider"><span>ou entre com e-mail</span></div>

    <form method="POST" action="/login" id="login-form">

      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="pw-toggle" id="pw-toggle" title="Mostrar/ocultar">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span>Entrar</span>
        <span>→</span>
      </button>

    </form>

  </div>

  <div class="footer-text">
    DOIT SEND · Disparos em massa com inteligência
  </div>

</div>

<script>
  // Mostrar/ocultar senha
  document.getElementById('pw-toggle').onclick = () => {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  };

  // Mostra banner de erro se ?erro estiver na URL
  const erro = new URLSearchParams(window.location.search).get('erro');
  if (erro) {
    const banner = document.getElementById('error-banner');
    if (erro === 'google') {
      banner.querySelector('span:last-child').textContent = 'Não foi possível entrar com o Google. Tente novamente.';
    }
    banner.classList.remove('hidden');
  }
</script>

</body>
</html>
